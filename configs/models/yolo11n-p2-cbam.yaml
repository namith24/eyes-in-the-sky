# YOLO11n-P2-CBAM: small-object enhanced YOLO11n for UAV survivor detection.
#
# Changes vs. stock YOLO11n (configs are otherwise identical):
#   1. Extra P2 (stride-4) detection head. In our dataset ~81% of survivors are
#      smaller than 32x32 px at 640 input (median ~16 px); stock YOLO11n's finest
#      head is stride 8, which leaves only ~2x2 feature cells per person.
#   2. CBAM (channel + spatial attention) on every detection-scale feature map,
#      to suppress cluttered background (rubble, foliage) before the Detect layer.
#
# CBAM is not registered in Ultralytics' model parser by default; use
# src/uav_survivor_detection/models/custom_yolo.py (register_custom_modules)
# before building or training from this file. Trained .pt files load normally.

nc: 1
scales:
  n: [0.50, 0.25, 1024]

backbone: # identical to YOLO11n
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  # top-down path
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12 cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]] # 15 cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17
  - [[-1, 2], 1, Concat, [1]] # 18 cat backbone P2
  - [-1, 2, C3k2, [128, False]] # 19 (P2/4 - extra small)
  - [-1, 1, CBAM, [32, 7]] # 20 attention on P2 (32 ch at scale n)

  # bottom-up path
  - [19, 1, Conv, [128, 3, 2]] # 21
  - [[-1, 16], 1, Concat, [1]] # 22 cat head P3
  - [-1, 2, C3k2, [256, False]] # 23 (P3/8 - small)
  - [-1, 1, CBAM, [64, 7]] # 24

  - [23, 1, Conv, [256, 3, 2]] # 25
  - [[-1, 13], 1, Concat, [1]] # 26 cat head P4
  - [-1, 2, C3k2, [512, False]] # 27 (P4/16 - medium)
  - [-1, 1, CBAM, [128, 7]] # 28

  - [27, 1, Conv, [512, 3, 2]] # 29
  - [[-1, 10], 1, Concat, [1]] # 30 cat head P5
  - [-1, 2, C3k2, [1024, True]] # 31 (P5/32 - large)
  - [-1, 1, CBAM, [256, 7]] # 32

  - [[20, 24, 28, 32], 1, Detect, [nc]] # 33 Detect(P2, P3, P4, P5)
